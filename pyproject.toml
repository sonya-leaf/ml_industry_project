# Project metadata and pinned dependencies.
# Run: uv sync  (or: pip install -e .)
# Lock deps once the list is final:  uv lock

[project]
name = "power-grid-incident-analyst"
version = "0.1.0"
description = "Parses Russian power-grid incident reports and answers questions over them."
requires-python = ">=3.11,<3.15"
dependencies = [
    "python-docx>=1.1",   # read .docx
    "jsonschema>=4.20",   # validate IncidentRecord / QAResponse
    "PyYAML>=6.0",        # config.yaml (incl. model pricing)
    "rapidfuzz>=3.0",     # fuzzy abbreviation matching
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# System prerequisite: LibreOffice (headless) for .doc -> .docx conversion.
# On macOS, textutil is used as a fallback and needs no install.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Default (E4/E7/E9/F) plus PEP 8 whitespace rules (E3): two blank lines between
# top-level definitions, consistent blank lines around classes/functions.
select = ["E3", "E4", "E7", "E9", "F"]
preview = true

[tool.ruff.lint.per-file-ignores]
# These standalone scripts insert the repo root on sys.path to support direct
# `python <file>` runs, so project imports legitimately appear after a non-import statement.
"tests/*.py" = ["E402"]
"scripts/*_smoke.py" = ["E402"]
"scripts/ask.py" = ["E402"]
"scripts/demo.py" = ["E402"]